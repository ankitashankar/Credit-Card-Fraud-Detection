apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-card-fraud-dashboard
  labels:
    app: credit-card-fraud-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credit-card-fraud-dashboard
  template:
    metadata:
      labels:
        app: credit-card-fraud-dashboard
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: dashboard
          image: credit-card-fraud-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
